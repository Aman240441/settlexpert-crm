name: Build Android APK (SettleExpert CRM)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK attached'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React Production Bundle
        env:
          VITE_API_URL: https://settlexpertcrm-api.onrender.com
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android App Icon from Favicon.png
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const iconSrc = path.join(process.cwd(), 'img', 'Favicon.png');
          const resDir = path.join(process.cwd(), 'android', 'app', 'src', 'main', 'res');
          if (fs.existsSync(resDir)) {
            const dirs = fs.readdirSync(resDir).filter(d => d.startsWith('mipmap') || d.startsWith('drawable'));
            for (const dir of dirs) {
              const targetDir = path.join(resDir, dir);
              ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png', 'splash.png'].forEach(file => {
                const targetFile = path.join(targetDir, file);
                if (fs.existsSync(targetFile)) {
                  fs.copyFileSync(iconSrc, targetFile);
                }
              });
            }
          }
          console.log('App icons updated from Favicon.png');
          "

      - name: Configure Android Permissions & Cleartext Traffic
        run: |
          # Add Internet permission and cleartext traffic to AndroidManifest.xml if not present
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy & Rename APK for Easy Access
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/SettleExpert-CRM.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SettleExpert-CRM-APK
          path: build-artifacts/SettleExpert-CRM.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SettleExpert CRM Android App v1.0.${{ github.run_number }}
          body: |
            ## 📱 SettleExpert CRM Android APK Release
            
            This is the official native Android build for **SettleExpert CRM**.
            
            ### 📥 Download & Installation:
            1. Download `SettleExpert-CRM.apk` below.
            2. Open the downloaded file on your Android phone.
            3. Tap **Install** (allow *Install from Unknown Sources* if prompted).
            4. Launch **SettleExpert CRM** and log in with your credentials!
            
            ### 🌐 Connected Backend & API:
            - **Production Server**: `https://settlexpertcrm-api.onrender.com`
            - **Database**: Supabase Connected
          files: build-artifacts/SettleExpert-CRM.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
